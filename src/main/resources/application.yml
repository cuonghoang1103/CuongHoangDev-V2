spring:
  application:
    name: api-backend

  dotenv:
    enabled: true
    filename: .env

  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      operations-sorter: method
      tags-sorter: alpha
      try-it-out-enabled: true
    group-configs:
      - group: 'Authentication'
        paths-to-match: '/api/v1/auth/**'
        packages-to-scan: com.cuonghoangdev.api_backend.controller
      - group: 'Blog'
        paths-to-match: '/api/v1/blog/**'
      - group: 'AI Chat'
        paths-to-match: '/api/v1/ai/**'
      - group: 'System'
        paths-to-match: '/api/v1/system/**'

  datasource:
    url: jdbc:postgresql://localhost:5432/cuonghoangdev_db
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
    validate-on-start: false
    baseline-version: '1'
    ignore-pending-migrations: true
    ignore-missing-migrations: true
    ignore-future-migrations: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 60000

  cache:
    type: simple

server:
  port: ${SERVER_PORT:${PORT:10000}}

  oauth2:
    client:
      registration:
        google:
          client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
          client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
          scope:
            - email
            - profile
        github:
          client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
          client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
          scope:
            - read:user
            - user:email
      provider:
        google:
          authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
          token-uri: https://oauth2.googleapis.com/token
          user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
          user-name-attribute: email
        github:
          authorization-uri: https://github.com/login/oauth/authorize
          token-uri: https://github.com/login/oauth/access_token
          user-info-uri: https://api.github.com/user
          user-name-attribute: login

app:
  jwt:
    secret: ${JWT_SECRET:CuongHoangDevV2SecretKeyNangCao2026NheMaNayCanItNhat256BitNhe}
    expiration-ms: 86400000
  base-url: ${APP_BASE_URL:}
  file:
    storage-path: ${APP_FILE_STORAGE_PATH:/Users/admin/Downloads/api-backend/uploads}
  email:
    from: ${APP_EMAIL_FROM:noreply@cuonghoangdev.com}
  contact:
    admin-email: ${APP_CONTACT_ADMIN_EMAIL:cuonghoang1103@gmail.com}
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: gemini-2.0-flash-lite
    embedding:
      provider: ${AI_EMBEDDING_PROVIDER:gemini}
      model: ${AI_EMBEDDING_MODEL:gemini-embedding-2}
      dimensions: 768
    chat:
      model: ${AI_CHAT_MODEL:gemini-2.0-flash-lite}
      max-tokens: 2048
      temperature: 0.7
    vectorstore:
      dimension: 768
      index-type: HNSW
      distance-type: COSINE_DISTANCE
    auto-index-on-startup: ${AI_AUTO_INDEX:false}
    seed-default-config: true

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
