# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: render-blueprints up
#
# This file tells Render:
#   - What service to create
#   - What health check to use
#   - How to build and run
#
# You can also set these manually in the Render Dashboard:
#   Dashboard → API Backend → Health Check → Path: /actuator/health
#                                         → Region: Singapore (or nearest)
#                                         → Initial Delay: 120s
#                                         → Timeout: 5m

services:
  - type: web
    name: api-backend
    env: java
    javaVersion: 21
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/api-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    initialDelaySeconds: 120
    timeoutSeconds: 300
    regions:
      - singapore
    plan: free
